name: Release

# Releases are explicit: manual dispatch only. The reactor is mixed-version
# by design, so maven-release-plugin is retired: releasing from the root
# would cut every module of the family at once and tag it as the parent. The scoped
# versions:set + per-line deploy flow that replaces it is not wired yet, so this workflow
# refuses until it lands — refusing is safe, half-releasing is not.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release without the license text in the artifact tree is a defect class this
      # repo has already shipped once — fail fast, before Maven runs.
      - name: Require LICENSE in the checkout
        run: test -f LICENSE

      - name: Refuse to release until the scoped flow lands
        run: |
          echo "::error::Release is blocked, and there is no manual path either. Every module"\
               "still parents to entity-metamodel-parent:2.0.0-SNAPSHOT, so any release cut"\
               "now publishes a POM whose parent resolves nowhere. Running release:prepare by"\
               "hand offers to substitute an unpublished parent version and then tags — do not."\
               "Wire the scoped versions:set + per-line deploy flow first."
          exit 1
