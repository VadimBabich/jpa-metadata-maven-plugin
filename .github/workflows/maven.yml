name: Maven CI/CD

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'bug/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    name: Build and test (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

  # Proves the reproducible-build mechanism off the maintainer's machine: two clean
  # test-skipped builds must produce byte-identical jars (project.build.outputTimestamp
  # pins the timestamps). JDK 21 = the release JDK. Cross-JDK/cross-OS comparison is a
  # designed follow-up, deliberately not gated here (WS-11 architecture doc §4.4).
  reproducibility:
    runs-on: ubuntu-latest
    name: Reproducible build check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build twice and compare jar digests
        run: |
          mvn -B clean package -DskipTests
          find . -path '*/target/*.jar' -not -path '*/it/*' -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/first-build.sha256"
          mvn -B clean package -DskipTests
          find . -path '*/target/*.jar' -not -path '*/it/*' -print0 | sort -z \
            | xargs -0 sha256sum > "$RUNNER_TEMP/second-build.sha256"
          diff "$RUNNER_TEMP/first-build.sha256" "$RUNNER_TEMP/second-build.sha256"
