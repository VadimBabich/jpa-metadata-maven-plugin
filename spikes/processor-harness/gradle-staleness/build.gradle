plugins {
    id 'java'
}

repositories {
    // mavenLocal first: the Spring jars are already in ~/.m2, keeping the experiment
    // offline-capable once the Gradle distribution is cached.
    mavenLocal()
    mavenCentral()
}

// The registration category under test is selected per run by swapping the processor jar —
// the two variants differ only in META-INF/gradle/incremental.annotation.processors.
def processorJar = providers.gradleProperty('processorJar')
        .getOrElse('variants/processor-isolating.jar')

dependencies {
    compileOnly 'org.springframework.data:spring-data-relational:3.5.0'
    compileOnly 'org.springframework.data:spring-data-commons:3.5.0'

    // @SpikeReferences lives in the spike jar; the un-variant jar serves as the compile-time
    // annotation dependency so the annotationProcessor path stays the only place a category
    // registration exists.
    compileOnly files('../target/processor-harness-spike-0-SPIKE.jar')

    annotationProcessor files(processorJar)
}
